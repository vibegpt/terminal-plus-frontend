name: CI

# Verifies every push and every pull request into main.
# Vercel's Git integration deploys previews and production, so this workflow never deploys.

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit -p api/tsconfig.json
      - run: npx tsx --test tests/*.test.ts
